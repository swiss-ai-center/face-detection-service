[project]
name = "face-detection"

version = "1.0.0"

requires-python = ">=3.10"
dependencies = [
    "common-code[test] @ git+https://github.com/swiss-ai-center/common-code.git@main",
    "numpy==1.26.4",
    "pillow==10.2.0",
    "retina-face==0.0.16",
    "tf-keras==2.16.0"


]
[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "--cov-config=.coveragerc --cov-report xml --cov-report term-missing --cov=./src"
